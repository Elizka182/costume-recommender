version: '3.8'

services:
  backend:
    build:
      context: ./costume-recommender-be
      dockerfile: Dockerfile
    container_name: costume-recommender-backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - app-network

  frontend:
    build:
      context: ./costume-recommender-fe
      dockerfile: Dockerfile
    container_name: costume-recommender-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: costume_recommender_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: recommender_db
      MYSQL_USER: recommender
      MYSQL_PASSWORD: halloween
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

volumes:
  mysql_data:
    driver: local

networks:
  app-network:
    driver: bridge
